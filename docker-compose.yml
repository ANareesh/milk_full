version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dairy
      POSTGRES_PASSWORD: dairy123
      POSTGRES_DB: dairydb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://dairy:dairy123@db:5432/dairydb
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: